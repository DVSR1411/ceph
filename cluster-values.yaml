# Helm chart: rook-ceph-cluster (the actual Ceph cluster + RGW + dashboard)
# Install with:
#   helm install rook-ceph-cluster rook-release/rook-ceph-cluster \
#     --namespace rook-ceph \
#     -f 02-cluster-values.yaml
#
# IMPORTANT: edit the `storage.nodes` section below with YOUR real node
# names and device names (or switch to the PVC-based block at the bottom).
# This is what prevents Rook from grabbing every disk on every node.

operatorNamespace: rook-ceph

cephClusterSpec:
  mon:
    count: 3
    allowMultiplePerNode: false   # spread mons across 3 different nodes

  mgr:
    count: 1
    modules:
      - name: pg_autoscaler
        enabled: true

  # Native Ceph Dashboard = your UI. No extra component needed.
  dashboard:
    enabled: true
    ssl: true

  # Skip metrics stack unless you already run Prometheus.
  monitoring:
    enabled: false

  # No CephFS / RBD needed for RGW-only -> don't enable crash collector
  # extras beyond default; keep it minimal.
  crashCollector:
    disable: false

  # ---- Storage: explicit device list (Option A) ----
  # Replace node names/devices with your real ones.
  # Run `kubectl get nodes` and check available disks with
  # `lsblk` on each node first.
  # NOTE: these node containers are running via vcluster's docker driver
  # (vind). Each one needs a loop device passed through with --privileged
  # and --device (see 05-setup-loop-devices.sh and
  # 06-vcluster-docker-nodes.yaml). Confirmed via `losetup -a` on the host:
  # NBD devices: image files connected via qemu-nbd on the host, injected
  # into each node container as TYPE=disk (see 11-setup-nbd-devices.sh).
  # Rook accepts TYPE=disk — this bypasses the loop/dm type filter.
  storage:
    useAllNodes: false
    useAllDevices: false
    nodes:
      - name: "worker-1"
        devices:
          - name: "/dev/nbd0"
      - name: "worker-2"
        devices:
          - name: "/dev/nbd1"
      - name: "worker-3"
        devices:
          - name: "/dev/nbd2"

  resources:
    mgr:
      limits: {cpu: "1000m", memory: "1Gi"}
      requests: {cpu: "500m", memory: "512Mi"}
    mon:
      limits: {cpu: "1000m", memory: "1Gi"}
      requests: {cpu: "500m", memory: "512Mi"}
    osd:
      limits: {cpu: "2000m", memory: "4Gi"}
      requests: {cpu: "500m", memory: "2Gi"}

# No need to create CephFS or CephBlockPool - RGW only.
cephFileSystems: []
cephBlockPools: []

# The RGW / S3 object store.
cephObjectStores:
  - name: rgw-store
    spec:
      metadataPool:
        replicated:
          size: 2          # lower overhead than default 3; raise if you need more durability
        failureDomain: host
      dataPool:
        replicated:
          size: 2
        failureDomain: host
      preservePoolsOnDelete: false
      gateway:
        port: 80
        instances: 1
        resources:
          limits: {cpu: "1000m", memory: "1Gi"}
          requests: {cpu: "250m", memory: "256Mi"}
    storageClass:
      enabled: false