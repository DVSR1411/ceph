<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ceph Storage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }

    header { background: #1a1d27; padding: 16px 32px; border-bottom: 1px solid #2a2d3e; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 1.2rem; font-weight: 600; color: #fff; }
    header span { font-size: 0.75rem; background: #ff6b35; color: #fff; padding: 2px 8px; border-radius: 12px; }

    .layout { display: grid; grid-template-columns: 260px 1fr; height: calc(100vh - 57px); }

    /* Sidebar */
    .sidebar { background: #1a1d27; border-right: 1px solid #2a2d3e; padding: 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
    .sidebar h2 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 4px; }
    .bucket-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: background 0.15s; }
    .bucket-item:hover { background: #2a2d3e; }
    .bucket-item.active { background: #2a2d3e; border-left: 3px solid #ff6b35; }
    .bucket-item .del-btn { color: #666; font-size: 0.75rem; cursor: pointer; padding: 2px 6px; border-radius: 4px; border: none; background: none; }
    .bucket-item .del-btn:hover { color: #ff4444; background: #3a1a1a; }
    .new-bucket { display: flex; gap: 6px; margin-top: 8px; }
    .new-bucket input { flex: 1; background: #0f1117; border: 1px solid #2a2d3e; color: #e0e0e0; padding: 6px 10px; border-radius: 6px; font-size: 0.8rem; }
    .new-bucket input:focus { outline: none; border-color: #ff6b35; }
    .btn { background: #ff6b35; color: #fff; border: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; white-space: nowrap; }
    .btn:hover { background: #e55a25; }
    .btn.secondary { background: #2a2d3e; color: #e0e0e0; }
    .btn.secondary:hover { background: #3a3d4e; }

    /* Main */
    .main { display: flex; flex-direction: column; overflow: hidden; }

    .toolbar { padding: 16px 24px; border-bottom: 1px solid #2a2d3e; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .toolbar .bucket-label { font-size: 0.9rem; color: #aaa; }
    .toolbar .bucket-label span { color: #ff6b35; font-weight: 600; }

    /* Drop zone */
    .drop-zone { margin: 0 24px; border: 2px dashed #2a2d3e; border-radius: 10px; padding: 28px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .drop-zone.dragover { border-color: #ff6b35; background: #1f1a17; }
    .drop-zone p { color: #666; font-size: 0.85rem; margin-top: 6px; }
    .drop-zone .icon { font-size: 2rem; }
    #fileInput { display: none; }

    /* File list */
    .file-list-wrap { flex: 1; overflow-y: auto; padding: 16px 24px; }
    .file-list-wrap h3 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; color: #666; font-weight: 500; padding: 6px 10px; border-bottom: 1px solid #2a2d3e; }
    td { padding: 8px 10px; border-bottom: 1px solid #1a1d27; }
    tr:hover td { background: #1a1d27; }
    .size-badge { font-size: 0.75rem; color: #aaa; }
    .download-btn { color: #4a9eff; background: none; border: none; cursor: pointer; font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; }
    .download-btn:hover { background: #1a2a3a; }
    .delete-file-btn { color: #666; background: none; border: none; cursor: pointer; font-size: 0.8rem; padding: 2px 8px; border-radius: 4px; }
    .delete-file-btn:hover { color: #ff4444; background: #3a1a1a; }
    .empty { color: #444; text-align: center; padding: 40px; font-size: 0.85rem; }

    /* Toast */
    #toast { position: fixed; bottom: 24px; right: 24px; background: #1a1d27; border: 1px solid #2a2d3e; color: #e0e0e0; padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 999; }
    #toast.show { opacity: 1; }
    #toast.success { border-color: #2ecc71; color: #2ecc71; }
    #toast.error { border-color: #ff4444; color: #ff4444; }

    /* Progress */
    #progressWrap { display: none; margin: 0 24px 12px; }
    #progressBar { height: 4px; background: #2a2d3e; border-radius: 2px; overflow: hidden; }
    #progressFill { height: 100%; width: 0%; background: #ff6b35; transition: width 0.2s; }
    #progressLabel { font-size: 0.75rem; color: #666; margin-top: 4px; }

    .no-bucket { display: flex; align-items: center; justify-content: center; flex: 1; color: #444; font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <h1>🪣 Ceph Storage</h1>
  <span>RGW</span>
</header>

<div class="layout">
  <!-- Sidebar: Buckets -->
  <div class="sidebar">
    <h2>Buckets</h2>
    <div id="bucketList"></div>
    <div class="new-bucket">
      <input id="newBucketInput" type="text" placeholder="new-bucket-name" />
      <button class="btn" onclick="createBucket()">+</button>
    </div>
  </div>

  <!-- Main Panel -->
  <div class="main" id="mainPanel">
    <div class="no-bucket" id="noBucket">← Select or create a bucket</div>

    <div id="bucketPanel" style="display:none; flex-direction:column; height:100%;">
      <div class="toolbar">
        <span class="bucket-label">Bucket: <span id="activeBucketLabel"></span></span>
        <button class="btn secondary" onclick="loadFiles()">↻ Refresh</button>
        <button class="btn" onclick="document.getElementById('fileInput').click()">Upload Files</button>
        <input type="file" id="fileInput" multiple onchange="uploadFiles(this.files)" />
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="icon">📂</div>
        <strong>Drop files here</strong>
        <p>Supports any file type — pcap, zip, logs, images, etc.</p>
      </div>

      <div id="progressWrap">
        <div id="progressBar"><div id="progressFill"></div></div>
        <div id="progressLabel"></div>
      </div>

      <div class="file-list-wrap">
        <h3>Files</h3>
        <div id="fileList"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const API = "";
  let activeBucket = null;

  // ── Toast ──────────────────────────────────────────────
  function toast(msg, type = "success") {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = `show ${type}`;
    setTimeout(() => t.className = "", 2800);
  }

  // ── Buckets ────────────────────────────────────────────
  async function loadBuckets() {
    const res = await fetch(`${API}/buckets`);
    const data = await res.json();
    const list = document.getElementById("bucketList");
    list.innerHTML = "";
    (data.buckets || []).forEach(b => {
      const div = document.createElement("div");
      div.className = "bucket-item" + (b === activeBucket ? " active" : "");
      div.innerHTML = `<span>🪣 ${b}</span><button class="del-btn" onclick="deleteBucket('${b}', event)">✕</button>`;
      div.onclick = () => selectBucket(b);
      list.appendChild(div);
    });
  }

  async function createBucket() {
    const input = document.getElementById("newBucketInput");
    const name = input.value.trim();
    if (!name) return;
    const res = await fetch(`${API}/buckets/${name}`, { method: "POST" });
    const data = await res.json();
    if (res.ok) { toast(data.message); input.value = ""; loadBuckets(); }
    else toast(data.error, "error");
  }

  async function deleteBucket(name, e) {
    e.stopPropagation();
    const confirmed = confirm(
      `Are you sure you want to permanently delete bucket "${name}"?\n\nThis cannot be undone.`,
    );
    if (!confirmed) return;
    const res = await fetch(`${API}/buckets/${name}`, { method: "DELETE" });
    const data = await res.json();
    if (res.ok) {
      toast(data.message);
      if (activeBucket === name) { activeBucket = null; showNoBucket(); }
      loadBuckets();
    } else toast(data.error, "error");
  }

  function selectBucket(name) {
    activeBucket = name;
    document.getElementById("activeBucketLabel").textContent = name;
    document.getElementById("noBucket").style.display = "none";
    document.getElementById("bucketPanel").style.display = "flex";
    loadBuckets();
    loadFiles();
  }

  function showNoBucket() {
    document.getElementById("noBucket").style.display = "flex";
    document.getElementById("bucketPanel").style.display = "none";
  }

  // ── Files ──────────────────────────────────────────────
  async function loadFiles() {
    if (!activeBucket) return;
    const res = await fetch(`${API}/files/${activeBucket}`);
    const data = await res.json();
    const wrap = document.getElementById("fileList");
    if (!data.files || data.files.length === 0) {
      wrap.innerHTML = `<div class="empty">No files in this bucket yet.</div>`;
      return;
    }
    wrap.innerHTML = `<table>
      <thead><tr><th>Name</th><th>Size</th><th>Actions</th></tr></thead>
      <tbody>${data.files.map(f => `
        <tr>
          <td>${f.key}</td>
          <td><span class="size-badge">${formatSize(f.size)}</span></td>
          <td>
            <button class="download-btn" onclick="downloadFile('${f.key}')">⬇ Download</button>
            <button class="delete-file-btn" onclick="deleteFile('${f.key}')">✕</button>
          </td>
        </tr>`).join("")}
      </tbody>
    </table>`;
  }

  async function uploadFiles(files) {
    if (!activeBucket || !files.length) return;
    const wrap = document.getElementById("progressWrap");
    const fill = document.getElementById("progressFill");
    const label = document.getElementById("progressLabel");
    wrap.style.display = "block";

    for (let i = 0; i < files.length; i++) {
      const file = files[i];
      label.textContent = `Uploading ${file.name} (${i + 1}/${files.length})...`;
      fill.style.width = `${((i) / files.length) * 100}%`;

      const form = new FormData();
      form.append("file", file);
      const res = await fetch(`${API}/upload/${activeBucket}`, { method: "POST", body: form });
      const data = await res.json();
      if (!res.ok) { toast(data.error, "error"); }
    }

    fill.style.width = "100%";
    label.textContent = `Done! ${files.length} file(s) uploaded.`;
    toast(`${files.length} file(s) uploaded to ${activeBucket}`);
    setTimeout(() => { wrap.style.display = "none"; fill.style.width = "0%"; }, 2000);
    loadFiles();
  }

  async function downloadFile(key) {
    const res = await fetch(`${API}/download/${activeBucket}/${encodeURIComponent(key)}`);
    if (!res.ok) { toast("Download failed", "error"); return; }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = key; a.click();
    URL.revokeObjectURL(url);
  }

  async function deleteFile(key) {
    if (!confirm(`Delete "${key}"?`)) return;
    const res = await fetch(`${API}/files/${activeBucket}/${encodeURIComponent(key)}`, { method: "DELETE" });
    const data = await res.json();
    if (res.ok) { toast(data.message); loadFiles(); }
    else toast(data.error, "error");
  }

  // ── Drag & Drop ────────────────────────────────────────
  const dropZone = document.getElementById("dropZone");
  dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("dragover"); });
  dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
  dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    uploadFiles(e.dataTransfer.files);
  });
  dropZone.addEventListener("click", () => document.getElementById("fileInput").click());

  // ── Helpers ────────────────────────────────────────────
  function formatSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)} KB`;
    if (bytes < 1024 ** 3) return `${(bytes / 1024 ** 2).toFixed(1)} MB`;
    return `${(bytes / 1024 ** 3).toFixed(1)} GB`;
  }

  document.getElementById("newBucketInput").addEventListener("keydown", e => { if (e.key === "Enter") createBucket(); });

  loadBuckets();
</script>
</body>
</html>
