# vcluster.yaml (or merge into your existing vcluster config)
#
# Confirmed via `losetup -a` on the host:
#   worker-1 -> /dev/loop30 (backed by /var/lib/rook-loop-disks/worker-1.img)
#   worker-2 -> /dev/loop31 (backed by /var/lib/rook-loop-disks/worker-2.img)
#   worker-3 -> /dev/loop32 (backed by /var/lib/rook-loop-disks/worker-3.img)
#
# NOTE: loop device numbers are assigned by `losetup -f` (next free number)
# and are NOT guaranteed to stay the same after a host reboot. If you
# recreate the loop devices later, re-check `losetup -a` and update both
# this file and 02-cluster-values.yaml if the numbers changed.

experimental:
  docker:
    nodes:
      - name: "worker-1"
        volumes:
          - "/run/udev:/run/udev:ro"
        args:
          - "--privileged"
          - "--device=/dev/loop30:/dev/loop30"
      - name: "worker-2"
        volumes:
          - "/run/udev:/run/udev:ro"
        args:
          - "--privileged"
          - "--device=/dev/loop31:/dev/loop31"
      - name: "worker-3"
        volumes:
          - "/run/udev:/run/udev:ro"
        args:
          - "--privileged"
          - "--device=/dev/loop32:/dev/loop32"
